# The primary author of this blog.
# Must be the same as `author` in `_config.yml`.
# Change `author1` to your shortname.
author1:
  name:              守夜人-桌遊社
  email:             itribgc@gmail.com

  # Used at the bottom of each page and at the top of the `about` layout
  # Markdown enabled, can use multiple paragraphs (enabled by `|`)
  about:             |
    守夜人桌遊社，這裡收藏我們的活動紀錄、社員交流、電子報與桌遊回憶。

    歡迎一起開局、一起冒險、一起留下精彩故事。

  # This photo will be used in the about section
  picture:
    path:            /assets/img/favicon.png
    srcset:
      1x:            /assets/img/favicon.png
      2x:            /assets/img/favicon.png

  # Social media icons in sidebar
  # Comment/uncomment to show/hide
  # Rearrange to change the order in which they appear
  # 這裡先維持 Hydejack 原本可辨識的 username 格式，實際連結會由 custom-social-links.js 修正
  social:
    # twitter:         <username>
    # github:          <username>
    # email:           <mail@domain.tld>
    # rss:             https://<url>/feed.xml
    # facebook:        <username>
    # google:          <number>
    # vk:              <username>

    #youtube:         itribgc

    # vimeo:           <username>
    # vine:            <username>
