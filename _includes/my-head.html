<script>
  // 強制覆蓋 Hydejack 原本 favicon
  (function () {
    function forceCustomFavicon() {
      const oldIcons = document.querySelectorAll(
        'link[rel="icon"], link[rel="shortcut icon"], link[rel="apple-touch-icon"], link[rel="mask-icon"]'
      );

      oldIcons.forEach(function (icon) {
        icon.parentNode.removeChild(icon);
      });

      const ico = document.createElement("link");
      ico.rel = "icon";
      ico.href = "/favicon.ico?v=10";
      ico.sizes = "any";
      document.head.appendChild(ico);

      const shortcut = document.createElement("link");
      shortcut.rel = "shortcut icon";
      shortcut.href = "/favicon.ico?v=10";
      document.head.appendChild(shortcut);

      const png = document.createElement("link");
      png.rel = "icon";
      png.type = "image/png";
      png.sizes = "512x512";
      png.href = "/assets/img/favicon.png?v=10";
      document.head.appendChild(png);

      const apple = document.createElement("link");
      apple.rel = "apple-touch-icon";
      apple.href = "/assets/img/favicon.png?v=10";
      document.head.appendChild(apple);
    }

    forceCustomFavicon();

    document.addEventListener("DOMContentLoaded", forceCustomFavicon);
    window.addEventListener("load", forceCustomFavicon);
  })();
</script>

<link rel="dns-prefetch" href="https://assets.gumroad.com">

<script type="module">
  const loadJS = x => new Promise(r => {
    if (!window.loadJS) {
      console.warn("window.loadJS 尚未載入，無法載入：", x);
      r();
      return;
    }

    const script = window.loadJS(x);

    if (script && script.addEventListener) {
      script.addEventListener("load", r);
    } else {
      r();
    }
  });

  let p1, p2, io1, io2, embedCreated, overlayCreated;

  function initGumroad() {
    if (!window.loadJS) {
      console.warn("window.loadJS 尚未載入，略過 Gumroad 初始化");
      return;
    }

    io1 ||= new IntersectionObserver(async (entries) => {
      if (entries.some(x => x.isIntersecting)) {
        p1 = p1 || loadJS("https://gumroad.com/js/gumroad-embed.js");
        await p1;

        !embedCreated && await new Promise(function check1(res) {
          if (typeof createGumroadEmbed !== "undefined") {
            embedCreated = 1;
            res(createGumroadEmbed());
          } else {
            setTimeout(() => check1(res), 200);
          }
        });

        await new Promise(function check2(res) {
          if (typeof GumroadEmbed !== "undefined") {
            res(GumroadEmbed.reload());
          } else {
            setTimeout(() => check2(res), 200);
          }
        });
      }
    }, { rootMargin: "1440px" });

    io2 ||= new IntersectionObserver(async (entries) => {
      if (entries.some(x => x.isIntersecting)) {
        p2 = p2 || loadJS("https://gumroad.com/js/gumroad.js");
        await p2;

        !overlayCreated && await new Promise(function check(res) {
          if (typeof createGumroadOverlay !== "undefined") {
            overlayCreated = 1;
            res(createGumroadOverlay());
          } else {
            setTimeout(() => check(res), 200);
          }
        });
      }
    }, { rootMargin: "300px" });

    document.querySelectorAll(".gumroad-product-embed").forEach(el => io1.observe(el));
    document.querySelectorAll(".gumroad-button").forEach(el => io2.observe(el));
  }

  document.addEventListener("DOMContentLoaded", function () {
    const pushStateEl = document.querySelector("hy-push-state");

    if (pushStateEl) {
      pushStateEl.addEventListener("load", initGumroad);
    } else {
      initGumroad();
    }
  });
</script>
