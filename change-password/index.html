<div class="change-password-page">
  <div class="change-password-card">
    <h1>第一次登入，請先修改密碼</h1>

    <p>
      為了保護社員帳號安全，第一次登入後需要先修改初始密碼。
      修改完成後系統會自動登出，請再使用新密碼重新登入。
    </p>

    <div class="change-password-notice">
      密碼建議至少 8 碼，請避免使用生日、電話、00000000 或過於簡單的密碼。
    </div>

    <div class="change-password-field">
      <label for="newPassword">新密碼</label>
      <input id="newPassword" type="password" autocomplete="new-password" placeholder="請輸入新密碼">
    </div>

    <div class="change-password-field">
      <label for="confirmPassword">再次輸入新密碼</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="請再次輸入新密碼">
    </div>

    <div class="change-password-actions">
      <button id="changePasswordBtn" type="button">修改密碼</button>
    </div>

    <div id="changePasswordMsg" class="change-password-msg"></div>
  </div>
</div>
