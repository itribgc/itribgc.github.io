<div class="guide-editor">
  <h1>編輯桌遊攻略</h1>
  <p>你可以修改自己的攻略文章內容。封面圖片請使用外部圖床圖片網址。</p>

  <label for="guideTitle">文章標題</label>
  <input id="guideTitle" type="text" maxlength="60" placeholder="例如：阿瓦隆新手攻略｜好人陣營怎麼判斷資訊">

  <label for="guideGameName">桌遊名稱</label>
  <input id="guideGameName" type="text" maxlength="40" placeholder="例如：阿瓦隆、璀璨寶石、風聲">

  <label>目前封面圖片</label>
  <div id="guideCurrentCover" class="guide-current-cover">
    <img id="guideCurrentCoverImg" alt="目前封面圖片">
  </div>

  <label for="guideCoverImage">封面圖片網址，選填</label>
  <input id="guideCoverImage" type="text" placeholder="請貼上圖片網址，例如 https://...jpg">

  <div class="guide-help">
    請先將圖片上傳至 ImgBB、Postimages 等外部圖床，再貼上圖片「直接連結」。<br>
    留空代表不顯示封面圖片。
  </div>

  <div id="guideCoverPreviewWrap" style="display:none; margin-top: 1rem;">
    <img id="guideCoverPreview" alt="封面圖片預覽">
  </div>

  <label for="guideSummary">文章摘要</label>
  <textarea id="guideSummary" maxlength="180" style="min-height: 90px;" placeholder="用一小段話介紹這篇攻略重點。"></textarea>

  <label for="guideContent">Markdown 內容</label>
  <textarea id="guideContent" maxlength="10000" placeholder="開始撰寫你的攻略..."></textarea>

  <div class="guide-editor-actions">
    <button id="guidePreviewBtn" class="guide-preview-btn" type="button">預覽</button>
    <button id="guideSaveBtn" class="guide-save-btn" type="button">儲存修改</button>
    <a id="guideBackLink" href="/guides/">返回桌遊攻略</a>
  </div>

  <div id="guideEditorMsg" class="guide-editor-msg"></div>

  <div id="guidePreview" class="guide-preview" style="display:none;">
    <h2>預覽</h2>
    <div id="guidePreviewContent" class="guide-preview-content"></div>
  </div>
</div>

<script src="/assets/js/guide-edit.js"></script>
