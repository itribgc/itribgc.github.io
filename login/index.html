<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>登入</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f5f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #3366cc;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      margin-top: 10px;
    }

    button:hover {
      background: #2855aa;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #msg {
      color: red;
      margin-top: 12px;
      font-size: 14px;
      text-align: center;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>登入</h2>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="密碼">

    <button id="loginBtn">登入</button>

    <div id="msg"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyARLnYPUUSVIXiK3UJnlSw93AeAm3_sSz8",
      authDomain: "itribgc-0.firebaseapp.com",
      projectId: "itribgc-0",
      storageBucket: "itribgc-0.firebasestorage.app",
      messagingSenderId: "535892877472",
      appId: "1:535892877472:web:2270ac423ffd6f38b1e9c5"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();

    const loginBtn = document.getElementById("loginBtn");
    const msg = document.getElementById("msg");

    auth.onAuthStateChanged(function(user) {
      if (user) {
        window.location.href = "/";
      }
    });

    loginBtn.addEventListener("click", function () {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        msg.innerText = "請輸入 Email 和密碼。";
        return;
      }

      loginBtn.disabled = true;
      loginBtn.innerText = "登入中...";
      msg.innerText = "";

      auth.signInWithEmailAndPassword(email, password)
        .then(function(userCredential) {
          window.location.href = "/";
        })
        .catch(function(error) {
          console.error("登入錯誤：", error);

          if (error.code === "auth/user-not-found") {
            msg.innerText = "找不到這個帳號。";
          } else if (error.code === "auth/wrong-password") {
            msg.innerText = "密碼錯誤。";
          } else if (error.code === "auth/invalid-email") {
            msg.innerText = "Email 格式不正確。";
          } else if (error.code === "auth/invalid-credential") {
            msg.innerText = "帳號或密碼錯誤。";
          } else {
            msg.innerText = "登入失敗，請稍後再試。";
          }

          loginBtn.disabled = false;
          loginBtn.innerText = "登入";
        });
    });

    document.getElementById("password").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        loginBtn.click();
      }
    });
  </script>

</body>
</html>
