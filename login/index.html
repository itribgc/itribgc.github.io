<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>守夜人-桌遊社｜登入</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #303437;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 360px;
      background: #ffffff;
      padding: 32px;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
      box-sizing: border-box;
    }

    h2 {
      margin: 0 0 24px 0;
      text-align: center;
      color: #222;
      font-size: 24px;
      font-weight: 700;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #333;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 11px 12px;
      margin-bottom: 14px;
      box-sizing: border-box;
      border: 1px solid #d6d6d6;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #3366cc;
      box-shadow: 0 0 0 2px rgba(51, 102, 204, 0.15);
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 4px;
      background: #3366cc;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
    }

    button:hover {
      background: #2855aa;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .link-button {
      width: 100%;
      margin-top: 12px;
      padding: 0;
      background: transparent;
      color: #3366cc;
      border: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: underline;
    }

    .link-button:hover {
      background: transparent;
      color: #224a99;
    }

    .link-button:disabled {
      background: transparent;
      color: #999;
      cursor: not-allowed;
    }

    #msg {
      margin-top: 14px;
      min-height: 20px;
      color: #d93025;
      font-size: 14px;
      text-align: center;
      line-height: 1.5;
      word-break: break-word;
    }

    #msg.success {
      color: #188038;
    }

    .hint {
      margin-top: 16px;
      color: #777;
      font-size: 13px;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>登入</h2>

    <label for="email">Email</label>
    <input id="email" type="email" placeholder="請輸入 Email" autocomplete="email">

    <label for="password">密碼</label>
    <input id="password" type="password" placeholder="請輸入密碼" autocomplete="current-password">

    <button id="loginBtn" type="button">登入</button>

    <button id="forgotBtn" class="link-button" type="button">忘記密碼？</button>

    <div id="msg"></div>

    <div class="hint">
      請使用提供給 守夜人-桌遊社 之電子信箱作為帳號登入
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script>
    console.log("login 頁面 JS 已載入");

    const firebaseConfig = {
      apiKey: "AIzaSyARLnYPUUSVIXiK3UJnlSw93AeAm3_sSz8",
      authDomain: "itribgc-0.firebaseapp.com",
      projectId: "itribgc-0",
      storageBucket: "itribgc-0.firebasestorage.app",
      messagingSenderId: "535892877472",
      appId: "1:535892877472:web:2270ac423ffd6f38b1e9c5"
    };

    let auth;

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const forgotBtn = document.getElementById("forgotBtn");
    const msg = document.getElementById("msg");

    function showMessage(text, type) {
      msg.innerText = text;
      msg.className = type === "success" ? "success" : "";
    }

    function setLoginLoading(isLoading) {
      loginBtn.disabled = isLoading;
      loginBtn.innerText = isLoading ? "登入中..." : "登入";
      forgotBtn.disabled = isLoading;
    }

    function setForgotLoading(isLoading) {
      forgotBtn.disabled = isLoading;
      forgotBtn.innerText = isLoading ? "寄送中..." : "忘記密碼？";
      loginBtn.disabled = isLoading;
    }

    function getFirebaseErrorMessage(error) {
      console.error("Firebase 錯誤：", error);

      if (!error || !error.code) {
        return "操作失敗，請稍後再試。";
      }

      switch (error.code) {
        case "auth/invalid-email":
          return "Email 格式不正確，請重新確認。";

        case "auth/user-disabled":
          return "這個帳號已被停用，請聯絡管理者。";

        case "auth/user-not-found":
          return "找不到這個帳號，請確認 Email 是否正確。";

        case "auth/wrong-password":
          return "密碼錯誤，請重新輸入。";

        case "auth/invalid-credential":
          return "帳號或密碼錯誤，請重新確認。";

        case "auth/missing-password":
          return "請輸入密碼。";

        case "auth/too-many-requests":
          return "登入嘗試次數過多，請稍後再試。";

        case "auth/network-request-failed":
          return "網路連線異常，請確認網路後再試。";

        default:
          return "操作失敗：" + error.message;
      }
    }

    function initFirebase() {
      try {
        if (typeof firebase === "undefined") {
          showMessage("Firebase SDK 尚未載入，請檢查網路或 script 連結。");
          console.error("firebase is undefined");
          return;
        }

        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }

        auth = firebase.auth();
        auth.languageCode = "zh-TW";

        console.log("Firebase 初始化成功");
      } catch (error) {
        console.error("Firebase 初始化失敗：", error);
        showMessage("Firebase 初始化失敗，請查看 Console。");
      }
    }

    async function doLogin() {
      console.log("登入按鈕被點擊");

      if (!auth) {
        showMessage("Firebase 尚未初始化完成，請重新整理頁面。");
        return;
      }

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      showMessage("");

      if (!email) {
        showMessage("請輸入 Email。");
        emailInput.focus();
        return;
      }

      if (!password) {
        showMessage("請輸入密碼。");
        passwordInput.focus();
        return;
      }

      try {
        setLoginLoading(true);

        console.log("開始登入：", email);

        await auth.signInWithEmailAndPassword(email, password);

        console.log("登入成功");

        window.location.replace("/");
      } catch (error) {
        showMessage(getFirebaseErrorMessage(error));
        setLoginLoading(false);
      }
    }

    async function sendResetPasswordEmail() {
      console.log("忘記密碼按鈕被點擊");

      if (!auth) {
        showMessage("Firebase 尚未初始化完成，請重新整理頁面。");
        return;
      }

      const email = emailInput.value.trim();

      showMessage("");

      if (!email) {
        showMessage("請先輸入您的 Email，再點選忘記密碼。");
        emailInput.focus();
        return;
      }

      try {
        setForgotLoading(true);

        await auth.sendPasswordResetEmail(email);

        showMessage("密碼重設信已寄出，請至您的信箱收信並重新設定密碼。", "success");
        setForgotLoading(false);
      } catch (error) {
        showMessage(getFirebaseErrorMessage(error));
        setForgotLoading(false);
      }
    }

    loginBtn.addEventListener("click", doLogin);
    forgotBtn.addEventListener("click", sendResetPasswordEmail);

    passwordInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        doLogin();
      }
    });

    emailInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        passwordInput.focus();
      }
    });

    initFirebase();
  </script>

</body>
</html>
